name: Build Pulsar PRO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets & Ensure Dist Directory
        run: |
          npm run build || npx vite build || true
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Pulsar PRO</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Setup Capacitor & Sync Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.pulsar.app",
            "appName": "Pulsar PRO",
            "webDir": "dist"
          }
          EOF
          npx cap add android || true
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsarPRO-v4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk







